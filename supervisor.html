<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة الحراسة العامة</title>
  
  <!-- خط Cairo -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- إطار Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <!-- مكتبة أيقونات Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <!-- ملف التنسيقات المخصص -->
  <link rel="stylesheet" href="css/style.css">
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

  <!-- زر فتح القائمة للشاشات الصغيرة -->
  <button class="menu-btn" onclick="toggleSidebar()"><i class="bi bi-list fs-5"></i> القائمة</button>

  <!-- الزر العائم للتحديث -->
  <button class="floating-btn" onclick="loadData()" title="تحديث البيانات"><i class="bi bi-arrow-repeat"></i></button>

  <!-- صفحة تسجيل الدخول -->
  <div id="login-page">
    <div class="login-card text-center">
      <img src="https://blogger.googleusercontent.com/img/a/AVvXsEjeojZRXAw4cRaMQwwj7L11hjP4UtD1rUVaIp2PgL4sMBolUofJc2HL87Fk--z79NLAj0_Mtv_067BC5aWgrmrXbtTLBcJ2apuFIbxAzp3RNYhiuxnRtvvvPmwAg3l0dBaunbrF9PT6JgSDI7nbAX627-nbM_6E6V6vwYOTGTxBGZSsLu3Spf3UPH6LCAQ=s379" style="max-width: 120px;" class="mx-auto mb-3" alt="شعار المؤسسة">
      <h4 class="fw-bold mb-4" style="color: #0f172a;">بوابة الحراسة العامة</h4>
      <form onsubmit="event.preventDefault(); doSupLogin();">
        <div class="mb-3 text-start">
          <input type="text" id="su" autocomplete="username" class="form-control" placeholder="اسم المستخدم" required>
        </div>
        <div class="mb-4 text-start">
          <input type="password" id="sp" autocomplete="current-password" class="form-control" placeholder="كلمة المرور" required>
        </div>
        <button type="submit" id="login-btn" class="btn btn-warning w-100 fw-bold py-2 shadow-sm text-white" style="background: var(--main-color); border:none;">
          دخول البوابة <i class="bi bi-box-arrow-in-left ms-1"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- التطبيق الرئيسي -->
  <div id="main-app" class="d-none">
    
    <!-- القائمة الجانبية -->
    <div class="sidebar" id="sidebar">
      <h5 class="text-center mb-4 sidebar-logo"><i class="bi bi-shield-lock-fill me-1"></i> الحراسة العامة</h5>
      <nav class="nav flex-column">
        <a class="nav-link active" onclick="showSec('move')"><i class="bi bi-person-walking"></i> سجل التحركات</a>
        <a class="nav-link" onclick="showSec('visit')"><i class="bi bi-person-badge"></i> الأساتذة الزائرون</a>
        <a class="nav-link" onclick="showSec('set')"><i class="bi bi-sliders"></i> إعدادات القوائم</a>
      </nav>
    </div>

    <!-- قسم المحتوى -->
    <div class="content">
      
      <!-- قسم سجل التحركات -->
      <section id="move-sec">
        <div class="card p-4 mb-4 border-start border-warning border-4">
          <h5 class="fw-bold text-warning card-title-custom mb-3">
            <i class="bi bi-person-walking fs-4"></i> تسجيل تحرك جديد
          </h5>
          <div class="row g-3">
            <div class="col-md-3">
              <label class="small fw-bold text-secondary mb-1">اسم الحارس</label>
              <input id="m-sup" class="form-control" placeholder="أدخل اسم الحارس">
            </div>
            <div class="col-md-3">
              <label class="small fw-bold text-secondary mb-1">اسم الأستاذ</label>
              <input id="m-t" class="form-control" placeholder="أدخل اسم الأستاذ">
            </div>
            <div class="col-md-4">
              <label class="small fw-bold text-secondary mb-1">السبب / الملاحظة</label>
              <input id="m-r" class="form-control" placeholder="سبب التحرك">
            </div>
            <div class="col-md-2 d-flex align-items-end">
              <button onclick="saveM()" id="m-btn" class="btn btn-warning text-white w-100 fw-bold" style="background-color: var(--main-color); border:none;">
                <i class="bi bi-floppy-fill me-1"></i> حفظ السجل
              </button>
            </div>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle text-center">
            <thead>
              <tr>
                <th>التاريخ</th>
                <th>الحارس</th>
                <th>الأستاذ</th>
                <th>السبب</th>
                <th>إجراء</th>
              </tr>
            </thead>
            <tbody id="move-rows"></tbody>
          </table>
        </div>
      </section>

      <!-- قسم الأساتذة الزائرون -->
      <section id="visit-sec" class="d-none">
        <div class="card p-4 mb-4 border-start border-success border-4">
          <h5 class="fw-bold text-success card-title-custom mb-3" id="v-title">
            <i class="bi bi-clock-history fs-4 me-1"></i> تسجيل ساعات زائر
          </h5>
          <div class="row g-3">
            <div class="col-md-2">
              <label class="small fw-bold text-secondary mb-1">التاريخ</label>
              <input type="date" id="v-d" class="form-control">
            </div>
            <div class="col-md-3">
              <label class="small fw-bold text-secondary mb-1">الأستاذ</label>
              <select id="v-n" class="form-select"></select>
            </div>
            <div class="col-md-2">
              <label class="small fw-bold text-secondary mb-1">السلك</label>
              <select id="v-l" class="form-select"></select>
            </div>
            <div class="col-md-3">
              <label class="small fw-bold text-secondary mb-1">المادة</label>
              <select id="v-s" class="form-select"></select>
            </div>
            <div class="col-md-1">
              <label class="small fw-bold text-secondary mb-1">الساعات</label>
              <input type="number" id="v-h" class="form-control" placeholder="0">
            </div>
            <div class="col-md-1 d-flex align-items-end">
              <button onclick="saveV()" id="v-btn" class="btn btn-success w-100 fw-bold">
                <i class="bi bi-floppy-fill"></i> حفظ
              </button>
            </div>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle text-center">
            <thead>
              <tr>
                <th>التاريخ</th>
                <th>الأستاذ</th>
                <th>السلك</th>
                <th>المادة</th>
                <th>ساعات</th>
                <th>المجموع</th>
                <th>إجراء</th>
              </tr>
            </thead>
            <tbody id="visit-rows"></tbody>
          </table>
        </div>
      </section>

      <!-- قسم إعدادات القوائم -->
      <section id="set-sec" class="d-none">
        <div class="card p-4 border-start border-primary border-4">
          <h5 class="fw-bold text-primary card-title-custom mb-4">
            <i class="bi bi-sliders fs-4"></i> إدارة القوائم المنسدلة
          </h5>
          <div class="row g-4">
            <div class="col-md-6">
              <div class="p-3 bg-light rounded-3 border">
                <label class="fw-bold small text-secondary mb-2">أسماء الأساتذة</label>
                <div class="input-group mb-3">
                  <input id="new-n" class="form-control" placeholder="إضافة اسم جديد...">
                  <button onclick="addS('name')" class="btn btn-primary"><i class="bi bi-plus-lg"></i> إضافة</button>
                </div>
                <select id="li-n" size="6" class="form-select mb-2"></select>
                <button onclick="delS('name')" class="btn btn-outline-danger btn-sm w-100 fw-bold"><i class="bi bi-trash-fill me-1"></i> حذف الاسم المحدد</button>
              </div>
            </div>

            <div class="col-md-6">
              <div class="p-3 bg-light rounded-3 border">
                <label class="fw-bold small text-secondary mb-2">المواد الدراسية</label>
                <div class="input-group mb-3">
                  <input id="new-s" class="form-control" placeholder="إضافة مادة جديدة...">
                  <button onclick="addS('subject')" class="btn btn-primary"><i class="bi bi-plus-lg"></i> إضافة</button>
                </div>
                <select id="li-s" size="6" class="form-select mb-2"></select>
                <button onclick="delS('subject')" class="btn btn-outline-danger btn-sm w-100 fw-bold"><i class="bi bi-trash-fill me-1"></i> حذف المادة المحُددة</button>
              </div>
            </div>
          </div>
        </div>
      </section>

    </div>
  </div>

  <!-- ملف API الموحد -->
  <script src="js/api.js"></script>

  <!-- السكريبت التفاعلي للواجهة -->
  <script>
    let editRow = null;

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('active');
    }

    async function doSupLogin() { 
      const btn = document.getElementById('login-btn');
      btn.innerHTML = 'جاري التحقق...';
      btn.disabled = true;

      const su = document.getElementById('su').value;
      const sp = document.getElementById('sp').value;

      try {
        const res = await SupervisorAPI.login(su, sp);
        if (res && res.success) { 
          document.getElementById('login-page').classList.add('d-none'); 
          document.getElementById('main-app').classList.remove('d-none'); 
          document.getElementById('v-d').valueAsDate = new Date(); 
          loadData(); 
        } else {
          alert("خطأ في البيانات! الرجاء التأكد من اسم المستخدم وكلمة المرور."); 
          btn.innerHTML = 'دخول البوابة <i class="bi bi-box-arrow-in-left ms-1"></i>';
          btn.disabled = false;
        }
      } catch (error) {
        btn.innerHTML = 'دخول البوابة <i class="bi bi-box-arrow-in-left ms-1"></i>';
        btn.disabled = false;
      }
    }

    async function loadData() {
      try {
        const res = await SupervisorAPI.getDashboardData();
        const data = res.data || res; 

        const fill = (id, arr, label) => { 
          document.getElementById(id).innerHTML = `<option value="">-- اختر ${label} --</option>` + arr.map(v => `<option value="${v}">${v}</option>`).join(''); 
        };

        if (data.settings) {
          fill('v-n', data.settings.names, 'أستاذ'); 
          fill('v-s', data.settings.subjects, 'مادة'); 
          fill('v-l', data.settings.levels, 'سلك');
          
          document.getElementById('li-n').innerHTML = data.settings.names.map(v => `<option value="${v}">${v}</option>`).join('');
          document.getElementById('li-s').innerHTML = data.settings.subjects.map(v => `<option value="${v}">${v}</option>`).join('');
        }
        
        let vH = ''; 
        if (data.visitors) {
          data.visitors.forEach(r => {
            vH += `<tr>
              <td>${r.date}</td>
              <td class="fw-bold text-primary">${r.name}</td>
              <td><span class="badge bg-light text-dark border">${r.level}</span></td>
              <td>${r.subject}</td>
              <td class="fw-bold">${r.hours}</td>
              <td class="fw-bold text-success">${r.monthTotal}</td>
              <td>
                <button onclick="trigEdit(${r.row},'${r.date}','${r.name}','${r.level}','${r.subject}',${r.hours})" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil-square"></i></button>
                <button onclick="delV(${r.row})" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash-fill"></i></button>
              </td>
            </tr>`;
          });
        }
        document.getElementById('visit-rows').innerHTML = vH || '<tr><td colspan="7" class="text-muted py-4">لا توجد سجلات حالياً</td></tr>';

        let mH = ''; 
        if (data.movements) {
          data.movements.forEach(r => {
            mH += `<tr>
              <td>${r.date}</td>
              <td>${r.sup}</td>
              <td class="fw-bold text-primary">${r.teacher}</td>
              <td>${r.reason}</td>
              <td>
                <button onclick="delM(${r.row})" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash-fill"></i></button>
              </td>
            </tr>`;
          });
        }
        document.getElementById('move-rows').innerHTML = mH || '<tr><td colspan="5" class="text-muted py-4">لا توجد سجلات حالياً</td></tr>';
      } catch (err) {
        console.error("خطأ في جلب البيانات:", err);
      }
    }

    function trigEdit(row, d, n, l, s, h) { 
      editRow = row; 
      document.getElementById('v-d').value = d; 
      document.getElementById('v-n').value = n; 
      document.getElementById('v-l').value = l; 
      document.getElementById('v-s').value = s; 
      document.getElementById('v-h').value = h; 
      document.getElementById('v-btn').innerHTML = '<i class="bi bi-check-lg"></i> تحديث'; 
      document.getElementById('v-title').innerHTML = '<i class="bi bi-pencil-square me-2"></i> تعديل السجل'; 
    }

    async function saveV() { 
      let d = document.getElementById('v-d').value, 
          n = document.getElementById('v-n').value, 
          l = document.getElementById('v-l').value, 
          s = document.getElementById('v-s').value, 
          h = document.getElementById('v-h').value; 

      if (editRow) {
        const res = await SupervisorAPI.updateVisitor(editRow, d, n, l, s, h);
        alert(res.message || res); 
        resetV(); 
        loadData(); 
      } else {
        const res = await SupervisorAPI.saveVisitor(d, n, l, s, h);
        alert(res.message || res); 
        resetV(); 
        loadData(); 
      }
    }

    function resetV() { 
      editRow = null; 
      document.getElementById('v-btn').innerHTML = '<i class="bi bi-floppy-fill"></i> حفظ'; 
      document.getElementById('v-title').innerHTML = '<i class="bi bi-clock-history me-2"></i> تسجيل ساعات زائر'; 
    }

    async function addS(type) { 
      let val = document.getElementById('new-' + (type === 'name' ? 'n' : 's')).value; 
      if (!val) return alert("الرجاء إدخال قيمة أولاً");
      
      const res = await SupervisorAPI.addSetting(type, val);
      alert(res.message || res); 
      loadData(); 
    }

    async function delS(type) { 
      let val = document.getElementById('li-' + (type === 'name' ? 'n' : 's')).value; 
      if (!val) return alert("الرجاء تحديد عنصر للحذف");
      
      const res = await SupervisorAPI.deleteSetting(type, val);
      alert(res.message || res); 
      loadData(); 
    }

    function showSec(s) { 
      document.querySelectorAll('section').forEach(el => el.classList.add('d-none')); 
      document.getElementById(s + '-sec').classList.remove('d-none'); 
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active')); 
      
      if (window.event && window.event.target) {
        let link = window.event.target.closest('.nav-link');
        if (link) link.classList.add('active');
      }

      if (window.innerWidth <= 768) toggleSidebar();
    }

    async function saveM() { 
      const sup = document.getElementById('m-sup').value;
      const t = document.getElementById('m-t').value;
      const r = document.getElementById('m-r').value;

      await SupervisorAPI.saveMovement(sup, t, r);
      document.getElementById('m-t').value = ''; 
      document.getElementById('m-r').value = ''; 
      loadData(); 
    }

    async function delM(r) { 
      if (confirm("تأكيد الحذف؟")) {
        await SupervisorAPI.deleteMovement(r);
        loadData(); 
      }
    }

    async function delV(r) { 
      if (confirm("تأكيد الحذف؟")) {
        await SupervisorAPI.deleteVisitor(r);
        loadData(); 
      }
    }
  </script>
</body>
</html>
