<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بوابة الحراسة العامة</title>
  
  <!-- خط Cairo -->
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- إطار Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <!-- مكتبة أيقونات Bootstrap -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  
  <link rel="stylesheet" href="./style.css">
</head>
<body data-page="supervisor">

  <!-- زر فتح القائمة للشاشات الصغيرة -->
  <button class="menu-btn" id="menu-btn"><i class="bi bi-list fs-5"></i> القائمة</button>

  <!-- الزر العائم للتحديث -->
  <button class="floating-btn" id="refresh-btn" title="تحديث البيانات"><i class="bi bi-arrow-repeat"></i></button>

  <!-- صفحة تسجيل الدخول -->
  <div id="login-page">
    <div class="login-card text-center">
      <img src="https://i.ibb.co/W4j7RyBd/INSCRIPTIONS-1.png" class="mx-auto mb-3 logo-120">
      <h4 class="fw-bold mb-4">بوابة الحراسة العامة</h4>
      <form id="supervisor-login-form">
        <div class="mb-3 text-start">
          <input type="text" id="su" autocomplete="username" class="form-control" placeholder="اسم المستخدم">
        </div>
        <div class="mb-4 text-start">
          <input type="password" id="sp" autocomplete="current-password" class="form-control" placeholder="كلمة المرور">
        </div>
        <button type="submit" class="btn btn-warning w-100 fw-bold py-2 shadow-sm text-white">
          دخول البوابة <i class="bi bi-box-arrow-in-left ms-1"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- التطبيق الرئيسي -->
  <div id="main-app" class="d-none">
    
    <!-- القائمة الجانبية -->
    <div class="sidebar" id="sidebar">
      <h5 class="text-center mb-4 sidebar-logo"><i class="bi bi-shield-lock-fill me-1"></i> الحراسة العامة</h5>
      <nav class="nav flex-column">
        <a class="nav-link active" data-section="move"><i class="bi bi-person-walking"></i> سجل التحركات</a>
        <a class="nav-link" data-section="visit"><i class="bi bi-person-badge"></i> الأساتذة الزائرون</a>
        <a class="nav-link" data-section="set"><i class="bi bi-sliders"></i> إعدادات القوائم</a>
      </nav>
    </div>

    <!-- قسم المحتوى -->
    <div class="content">
      
      <!-- قسم سجل التحركات -->
      <section id="move-sec">
        <div class="card p-4 mb-4 border-start border-warning border-4">
          <h5 class="fw-bold text-warning card-title-custom mb-3">
            <i class="bi bi-person-walking fs-4"></i> تسجيل تحرك جديد
          </h5>
          <div class="row g-3">
            <div class="col-md-3">
              <label class="small fw-bold text-secondary mb-1">اسم الحارس</label>
              <input id="m-sup" class="form-control" placeholder="أدخل اسم الحارس">
            </div>
            <div class="col-md-3">
              <label class="small fw-bold text-secondary mb-1">اسم الأستاذ</label>
              <input id="m-t" class="form-control" placeholder="أدخل اسم الأستاذ">
            </div>
            <div class="col-md-4">
              <label class="small fw-bold text-secondary mb-1">السبب / الملاحظة</label>
              <input id="m-r" class="form-control" placeholder="سبب التحرك">
            </div>
            <div class="col-md-2 d-flex align-items-end">
              <button id="save-move-btn" class="btn btn-warning text-white w-100 fw-bold">
                <i class="bi bi-floppy-fill me-1"></i> حفظ السجل
              </button>
            </div>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle text-center">
            <thead>
              <tr>
                <th>التاريخ</th>
                <th>الحارس</th>
                <th>الأستاذ</th>
                <th>السبب</th>
                <th>إجراء</th>
              </tr>
            </thead>
            <tbody id="move-rows"></tbody>
          </table>
        </div>
      </section>

      <!-- قسم الأساتذة الزائرون -->
      <section id="visit-sec" class="d-none">
        <div class="card p-4 mb-4 border-start border-success border-4">
          <h5 class="fw-bold text-success card-title-custom mb-3" id="v-title">
            <i class="bi bi-clock-history fs-4 me-1"></i> تسجيل ساعات زائر
          </h5>
          <div class="row g-3">
            <div class="col-md-2">
              <label class="small fw-bold text-secondary mb-1">التاريخ</label>
              <input type="date" id="v-d" class="form-control">
            </div>
            <div class="col-md-3">
              <label class="small fw-bold text-secondary mb-1">الأستاذ</label>
              <select id="v-n" class="form-select"></select>
            </div>
            <div class="col-md-2">
              <label class="small fw-bold text-secondary mb-1">السلك</label>
              <select id="v-l" class="form-select"></select>
            </div>
            <div class="col-md-3">
              <label class="small fw-bold text-secondary mb-1">المادة</label>
              <select id="v-s" class="form-select"></select>
            </div>
            <div class="col-md-1">
              <label class="small fw-bold text-secondary mb-1">الساعات</label>
              <input type="number" id="v-h" class="form-control" placeholder="0">
            </div>
            <div class="col-md-1 d-flex align-items-end">
              <button id="save-visit-btn" id="v-btn" class="btn btn-success w-100 fw-bold">
                <i class="bi bi-floppy-fill"></i> حفظ
              </button>
            </div>
          </div>
        </div>

        <div class="table-responsive">
          <table class="table table-hover align-middle text-center">
            <thead>
              <tr>
                <th>التاريخ</th>
                <th>الأستاذ</th>
                <th>السلك</th>
                <th>المادة</th>
                <th>ساعات</th>
                <th>المجموع</th>
                <th>إجراء</th>
              </tr>
            </thead>
            <tbody id="visit-rows"></tbody>
          </table>
        </div>
      </section>

      <!-- قسم إعدادات القوائم -->
      <section id="set-sec" class="d-none">
        <div class="card p-4 border-start border-primary border-4">
          <h5 class="fw-bold text-primary card-title-custom mb-4">
            <i class="bi bi-sliders fs-4"></i> إدارة القوائم المنسدلة
          </h5>
          <div class="row g-4">
            <div class="col-md-6">
              <div class="p-3 bg-light rounded-3 border">
                <label class="fw-bold small text-secondary mb-2">أسماء الأساتذة</label>
                <div class="input-group mb-3">
                  <input id="new-n" class="form-control" placeholder="إضافة اسم جديد...">
                  <button id="add-name-btn" class="btn btn-primary"><i class="bi bi-plus-lg"></i> إضافة</button>
                </div>
                <select id="li-n" size="6" class="form-select mb-2"></select>
                <button id="delete-name-btn" class="btn btn-outline-danger btn-sm w-100 fw-bold"><i class="bi bi-trash-fill me-1"></i> حذف الاسم المحدد</button>
              </div>
            </div>

            <div class="col-md-6">
              <div class="p-3 bg-light rounded-3 border">
                <label class="fw-bold small text-secondary mb-2">المواد الدراسية</label>
                <div class="input-group mb-3">
                  <input id="new-s" class="form-control" placeholder="إضافة مادة جديدة...">
                  <button id="add-subject-btn" class="btn btn-primary"><i class="bi bi-plus-lg"></i> إضافة</button>
                </div>
                <select id="li-s" size="6" class="form-select mb-2"></select>
                <button id="delete-subject-btn" class="btn btn-outline-danger btn-sm w-100 fw-bold"><i class="bi bi-trash-fill me-1"></i> حذف المادة المحُددة</button>
              </div>
            </div>
          </div>
        </div>
      </section>

    </div>
  </div>

  
  <script src="./api.js"></script>
  <script src="./app.js"></script>
</body>
</html>
