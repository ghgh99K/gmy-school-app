<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>استمارة التبرير</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="employee.css">
</head>
<body>

  <div class="card p-4">
    <div class="text-center mb-4">
      <img src="https://i.ibb.co/W4j7RyBd/INSCRIPTIONS-1.png" class="mb-2 employee-logo" alt="Logo">
      <h5 class="fw-bold text-primary">استمارة التبرير</h5>
      <p class="small text-muted">قسم الموارد البشرية</p>
    </div>

    <div id="form-container">
      <div class="mb-3">
        <label class="form-label">الرقم التعريفي (ID):</label>
        <input type="number" id="emp-id" class="form-control" placeholder="أدخل رقمك الخاص">
      </div>
      <div class="mb-3">
        <label class="form-label">الاسم الكامل:</label>
        <input type="text" id="emp-name" class="form-control" placeholder="اكتب اسمك">
      </div>
      <div class="mb-3">
        <label class="form-label">نوع العذر:</label>
        <select id="emp-type" class="form-select">
          <option value="تأخر">تأخر صباحي / مسائي</option>
          <option value="غياب">غياب يوم كامل</option>
          <option value="خروج مبكر">خروج مبكر</option>
        </select>
      </div>
      <div class="mb-4">
        <label class="form-label">تفاصيل العذر والمبرر:</label>
        <textarea id="emp-details" class="form-control" rows="3" placeholder="مثال: طارئ عائلي، موعد طبي..."></textarea>
      </div>
      <button class="btn btn-submit w-100" id="btn-send">إرسال التبرير للإدارة</button>
    </div>

    <div id="success-msg" class="text-center d-none mt-4">
      <h4 class="text-success fw-bold">✔️ تم الإرسال</h4>
      <p class="text-muted mt-2">تم تسجيل تبريرك بنجاح في نظام الموارد البشرية. شكراً لتعاونك.</p>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="employee.js"></script>
</body>
</html>
